name: aca

# Portas de host NÃO padrão — auditadas em 2026-08-19 contra containers locais.
# Internamente o container continua na porta nativa do serviço.
#   PostgreSQL  55432 → 5432   (5432=clinica-postgres, 5433=[other-local-service])
#   Redis       56379 → 6379   (6379 já estava publicada)
#   pgAdmin     15050 → 80     (5050 UDP em uso no host)

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aca-postgres
    environment:
      POSTGRES_USER: aca
      POSTGRES_PASSWORD: aca
      POSTGRES_DB: aca
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aca -d aca"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aca-redis
    ports:
      - "56379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: aca-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "15050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
